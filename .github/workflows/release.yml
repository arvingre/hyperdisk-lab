name: Release HyperDisk Lab

on:
  push:
    branches:
      - main
      - init-doc

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🗜️ Zip project contents
        run: |
          zip -r hyperdisk-lab.zip . -x "*.git*" "*.DS_Store"

      - name: 📂 List files
        run: ls -la

      - name: 🚀 Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v1
        with:
          name: "HyperDisk Release ${{ github.run_number }}"
          tag_name: "v1.${{ github.run_number }}"
          files: hyperdisk-lab.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
